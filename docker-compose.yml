services:
  db:
    image: mariadb:11
    cpus: "0.25"
    mem_limit: 192m
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_password
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - ./.stack-data/mysql:/var/lib/mysql

  web:
    image: wordpress:latest
    cpus: "0.25"
    mem_limit: 320m
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
    volumes:
      - ./.stack-data/wordpress:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./cineplexx-page-gd-20261010-091812-wmwm2ryogei1.wpress:/var/www/html/wp-content/ai1wm-backups/backup.wpress:ro
